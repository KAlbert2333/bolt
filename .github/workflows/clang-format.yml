name: clang-format

on:
  push:
    branches: [ Arm-CI ]
  pull_request:
    branches: [ Arm-CI ]
  workflow_dispatch:
    # 可选：设置输入参数，方便在界面上选择要检查的分支
    inputs:
      target-ref:
        description: '要检查的Git引用 (分支、标签或提交)'
        required: true
        default: 'Arm-CI'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: [ self-hosted, small ]
    outputs:
      source_changed: ${{ steps.filter.outputs.source_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        uses: ./.github/actions/changes-check
        with:
          filters: |
            bolt/**
            !bolt/**/*.md

  format-check:
    needs: changes
    if: ${{ needs.changes.outputs.source_changed == 'true' }}
    runs-on: [ self-hosted, small ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # 兼容 workflow_dispatch 和 push 两种触发方式
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target-ref || github.ref }}

      - name: clang-format check
        run: |
          docker run --rm \
            -v "$(pwd)":/workspace \
            -w /workspace \
            --user root \
            bolt-registry:5000/bolt-ci:20251217 \
            make clang-format-check
